[project]
name = "plum-claims-backend"
version = "0.1.0"
description = "Explainable health-claim processing backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.40,<2",
    "fastapi>=0.116,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "pillow>=11,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "pypdfium2>=4.30,<5",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
claimsctl = "claims_backend.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_backend"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "clean_setup_data: run with empty policy and member setup tables",
]

[tool.ruff]
extend-exclude = ["*.md", "problem_statement"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["claims_backend"]
