x-claims-backend: &claims-backend
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file:
    - .env
  environment: &claims-env
    CLAIMS_DATA_ROOT: /app/data/documents
    CLAIMS_LOG_ROOT: /app/data/logs
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  volumes:
    - claims-documents:/app/data/documents
    - claims-logs:/app/data/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claims}
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - claims-postgres-data:/var/lib/postgresql/data

  setup:
    <<: *claims-backend
    command: >
      sh -c "uv run python -m alembic upgrade head &&
             uv run python scripts/setup_dev_data.py"
    depends_on:
      postgres:
        condition: service_healthy

  phoenix:
    <<: *claims-backend
    command: uv run phoenix serve --host 0.0.0.0 --port 6006
    ports:
      - "6006:6006"
    volumes:
      - phoenix-data:/root/.phoenix
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *claims-backend
    command: uv run uvicorn claims_backend.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *claims-backend
    command: uv run claims-worker run-loop
    depends_on:
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      phoenix:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CLAIMS_API_BASE_URL: http://api:8000
      CLAIMS_DEV_USERNAME: ${CLAIMS_DEV_USERNAME}
      CLAIMS_REVIEWER_USERNAME: ${CLAIMS_REVIEWER_USERNAME}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  claims-postgres-data:
  claims-documents:
  claims-logs:
  phoenix-data:
